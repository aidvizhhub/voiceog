<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>voiceog — локальный голосовой ввод</title>
<style>
  :root {
    --bg: #0c0c0e;
    --panel: #131010;
    --line: #3d3838;
    --line-2: #4a4545;
    --text: #b8b2b2;
    --bright: #f2eded;
    --muted: #716b6a;
    --white: #ffffff;
    --mono: "Berkeley Mono", "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo,
            Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    color-scheme: dark light;
  }

  /* светлая тема — палитра оттуда же (opencode.ai, prefers-color-scheme: light) */
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #ffffff;
      --panel: #fafafa;
      --line: #d9d8d8;
      --line-2: #d0cfce;
      --text: #1d1d1f;
      --bright: #000000;
      --white: #000000;
      --muted: #646262;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 16px;
    line-height: 1.6;
  }
  a { color: var(--text); text-decoration: none; }
  a:hover { color: var(--white); }
  button { font-family: var(--mono); }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 32px;
    border-bottom: 1px solid var(--line);
    gap: 24px;
    flex-wrap: wrap;
  }
  .logo { font-weight: 700; font-size: 22px; color: var(--white); letter-spacing: .5px; }
  .logo .dim { color: var(--muted); }
  nav { display: flex; gap: 26px; font-size: 15px; }

  main {
    max-width: 1180px;
    margin: 48px auto;
    padding: 0 24px;
  }

  .frame {
    background: var(--panel);
    border: 1px solid var(--line);
  }

  .row {
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 40px;
    padding: 40px 56px;
  }
  .row + .row { border-top: 1px solid var(--line); }

  .label { color: var(--muted); font-size: 15px; padding-top: 8px; }
  .label .num { color: var(--muted); }
  .label .cap { color: var(--text); font-weight: 500; }

  .rec {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 26px 20px;
    font-size: 18px;
    font-weight: 500;
    letter-spacing: 1px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line-2);
    border-radius: 4px;
    cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .rec:hover { border-color: var(--text); color: var(--bright); }
  .rec.on { border-color: var(--bright); color: var(--bright); }
  .rec .dot { color: var(--muted); font-size: 20px; line-height: 1; }
  .rec.on .dot { color: var(--bright); animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .status { margin-top: 14px; color: var(--muted); font-size: 14px; min-height: 22px; }
  .status.err { color: #ff9d8a; }

  textarea {
    width: 100%;
    min-height: 220px;
    resize: vertical;
    padding: 16px;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line-2);
    border-radius: 4px;
    outline: none;
  }
  textarea::placeholder { color: var(--muted); }
  textarea:focus { border-color: var(--text); }

  .actions { display: flex; gap: 12px; margin-top: 16px; }
  .btn {
    padding: 6px 16px;
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--line-2);
    border-radius: 4px;
    cursor: pointer;
  }
  .btn:hover { color: var(--bright); border-color: var(--text); }

  footer {
    max-width: 1180px;
    margin: 0 auto 40px;
    padding: 0 24px;
    color: var(--muted);
    font-size: 14px;
  }
  footer .on { color: var(--bright); }

  @media (max-width: 760px) {
    .row { grid-template-columns: 1fr; gap: 16px; padding: 28px 24px; }
    nav { gap: 16px; }
  }
</style>
</head>
<body>
<header>
  <div class="logo">voice<span class="dim">og</span></div>
  <nav>
    <a href="https://github.com/aidvizhhub/voiceog" target="_blank" rel="noopener">GitHub</a>
    <a href="http://127.0.0.1:7777/health" target="_blank" rel="noopener">Health</a>
  </nav>
</header>

<main>
  <div class="frame">
    <div class="row">
      <div class="label"><span class="num">[1]</span> <span class="cap">Запись</span></div>
      <div>
        <button id="rec" class="rec"><span class="dot">●</span><span id="recLabel">НАЖМИ И ГОВОРИ</span></button>
        <div id="status" class="status">готов</div>
      </div>
    </div>

    <div class="row">
      <div class="label"><span class="num">[2]</span> <span class="cap">Текст</span></div>
      <div>
        <textarea id="out" placeholder="тут появится распознанный текст..."></textarea>
        <div class="actions">
          <button id="copy" class="btn">Копировать</button>
          <button id="clear" class="btn">Очистить</button>
        </div>
      </div>
    </div>
  </div>
</main>

<footer>
  <span class="on">●</span> локально · parakeet-tdt-0.6b-v3-int8 · без облака
</footer>

<script>
const btn = document.getElementById('rec');
const label = document.getElementById('recLabel');
const statusEl = document.getElementById('status');
const out = document.getElementById('out');

let recorder = null;
let chunks = [];
let stream = null;
let recording = false;

function setStatus(text, isErr) {
  statusEl.textContent = text;
  statusEl.classList.toggle('err', !!isErr);
}

function ui(on) {
  btn.classList.toggle('on', on);
  label.textContent = on ? 'СТОП' : 'НАЖМИ И ГОВОРИ';
}

async function start() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
    });
    chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = onStop;
    recorder.start();
    recording = true;
    ui(true);
    setStatus('слушаю...');
  } catch (e) {
    setStatus('нет доступа к микрофону: ' + e.message, true);
  }
}

function stop() {
  if (!recorder) return;
  recording = false;
  ui(false);
  setStatus('распознаю...');
  recorder.stop();
  if (stream) stream.getTracks().forEach((t) => t.stop());
}

async function onStop() {
  try {
    const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
    const ab = await blob.arrayBuffer();

    const ac = new AudioContext();
    const decoded = await ac.decodeAudioData(ab.slice(0));
    await ac.close();

    // пересэмплируем в 16 кГц моно
    const TARGET = 16000;
    const frames = Math.max(1, Math.ceil(decoded.duration * TARGET));
    const off = new OfflineAudioContext(1, frames, TARGET);
    const src = off.createBufferSource();
    src.buffer = decoded;
    src.connect(off.destination);
    src.start();
    const rendered = await off.startRendering();
    const f32 = rendered.getChannelData(0);

    const pcm = new Int16Array(f32.length);
    for (let i = 0; i < f32.length; i++) {
      const s = Math.max(-1, Math.min(1, f32[i]));
      pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
    }

    const resp = await fetch('/transcribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/octet-stream' },
      body: pcm.buffer,
    });
    const data = await resp.json();
    if (!resp.ok || data.error) throw new Error(data.error || ('HTTP ' + resp.status));

    const text = (data.text || '').trim();
    if (text) {
      out.value = out.value.trim() ? out.value.replace(/\s*$/, '') + '\n' + text : text;
    }
    setStatus(text ? ('готово · ' + data.ms + ' мс') : 'тишина — ничего не разобрал');
  } catch (e) {
    setStatus('ошибка: ' + e.message, true);
  }
}

btn.addEventListener('click', () => (recording ? stop() : start()));
document.getElementById('clear').addEventListener('click', () => { out.value = ''; setStatus('готов'); });
document.getElementById('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(out.value); setStatus('скопировано'); }
  catch (e) { setStatus('не скопировалось: ' + e.message, true); }
});
</script>
</body>
</html>
